###Error Messages
DUE_DATE_BEFORE_INVOICE_DATE=The due date cannot be before the invoice date.
INVOICE_NOT_FOUND=The invoice does not exist.
UNSUPPORTED_DOCUMENT_TYPE=Only PDF, PNG and JPEG documents are supported (received {0}).
AMOUNT_NEGATIVE=Amounts cannot be negative.
CUSTOMER_NAME_MISSING=Enter a company name or a contact name.
QUANTITY_NOT_POSITIVE=The quantity must be greater than 0.
TAX_RATE_NEGATIVE=The VAT rate cannot be negative.
SALES_INVOICE_WITHOUT_ITEMS=Add at least one item to the invoice.
INVOICE_CLOSED=Paid and cancelled invoices cannot be edited. Reopen the invoice first.
EDIT_SENT_INVOICE=This invoice has already been sent to the customer. If you change it, send the corrected invoice again.
SALES_INVOICE_BEING_EDITED=The invoice is being edited. Save or discard the changes first.
SALES_INVOICE_STATUS_CHANGE_NOT_ALLOWED=This action is not possible in the invoice's current status.
