name: "# 5.2. Transport and Deploy to PRD from PRD-HOTFIX"

on:
  workflow_dispatch:

jobs:
  compute-hotfix-version:
    runs-on: ubuntu-latest
    outputs:
      hotfix-version: ${{ steps.compute-version.outputs.hotfix-version }}
    steps:
      - name: Checkout prd branch
        uses: actions/checkout@v7
        with:
          ref: prd
          fetch-depth: 0

      - name: Compute hotfix version
        id: compute-version
        run: |
          BASE_VERSION=$(jq -r '.version' version.json)
          echo "Base version: $BASE_VERSION"
          EXISTING=$(git tag --list "v${BASE_VERSION}-hotfix-*" | sed "s/v${BASE_VERSION}-hotfix-//" | sort -n | tail -1)
          if [ -z "$EXISTING" ]; then
            NEXT=1
          else
            NEXT=$((EXISTING + 1))
          fi
          HOTFIX_VERSION="${BASE_VERSION}-hotfix-${NEXT}"
          echo "New hotfix version: $HOTFIX_VERSION"
          echo "hotfix-version=$HOTFIX_VERSION" >> $GITHUB_OUTPUT

  rebuild-prd-branch:
    uses: ./.github/workflows/rebuild-branch.yml
    permissions:
      contents: write
    needs: compute-hotfix-version
    with:
      branch: prd      
      source_ref: prd-hotfix      
    secrets: inherit

  tag-hotfix-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [compute-hotfix-version, rebuild-prd-branch]
    steps:
      - name: Fetch GitHub App Token
        id: fetch-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_KEY }}

      - name: Checkout prd branch
        uses: actions/checkout@v7
        with:
          ref: prd
          fetch-depth: 0
          token: ${{ steps.fetch-token.outputs.token }}

      - name: Update version.json
        run: |
          sed -i 's/"version":".*"/"version":"${{ needs.compute-hotfix-version.outputs.hotfix-version }}"/' version.json

      - name: Update mta.yaml version
        run: |
          sed -i 's/^version: .*/version: ${{ needs.compute-hotfix-version.outputs.hotfix-version }}/' mta.yaml

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push version files
        run: |
          git add version.json mta.yaml
          git commit -m "chore: bump version to ${{ needs.compute-hotfix-version.outputs.hotfix-version }} [skip ci]"
          git push

      - name: Create and push tag
        run: |
          git tag "v${{ needs.compute-hotfix-version.outputs.hotfix-version }}"
          git push origin "v${{ needs.compute-hotfix-version.outputs.hotfix-version }}"

      - name: Create GitHub Release
        run: |
          gh release create "v${{ needs.compute-hotfix-version.outputs.hotfix-version }}" \
            --title "[HOTFIX] v${{ needs.compute-hotfix-version.outputs.hotfix-version }}" \
            --notes "Hotfix release deployed to Production." \
            --target prd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Call_Deploy_Production:
    uses: ./.github/workflows/deployment-script.yml
    needs: tag-hotfix-version
    with:
      environment: Production
      ref: prd
      stage: prd
    secrets: inherit
